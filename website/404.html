<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>页面不存在 · TrueSight</title>
    <link rel="icon" type="image/svg+xml" href="/assets/truesight-mark.svg" />
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue",
          "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #1d1d1f;
        background: #f5f5f7;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(60% 60% at 50% 0%, rgba(0, 113, 227, 0.12), transparent 70%), #f5f5f7;
      }
      main {
        width: min(100%, 520px);
        padding: 52px 44px;
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 26px;
        background: #fff;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.08);
        text-align: center;
      }
      img { width: 52px; height: 52px; margin: 0 auto 22px; }
      p {
        margin: 0 0 10px;
        color: #0071e3;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        letter-spacing: 0.18em;
      }
      h1 { margin: 0; font-size: clamp(34px, 8vw, 46px); font-weight: 650; letter-spacing: -0.04em; }
      span { display: block; margin: 14px 0 28px; color: #6e6e73; font-size: 14px; line-height: 1.7; }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 24px;
        border-radius: 999px;
        color: #fff;
        background: #0071e3;
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
        transition: background 0.2s ease;
      }
      a:hover { background: #0077ed; }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/truesight-mark.svg" alt="" />
      <p>404 · PAGE NOT FOUND</p>
      <h1>页面不存在</h1>
      <span>这个地址没有对应的页面，可能已经移动或输入有误。</span>
      <a href="/">返回 TrueSight 首页</a>
    </main>
  </body>
</html>
