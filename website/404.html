<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>页面不存在 · TrueSight</title>
    <link rel="icon" type="image/svg+xml" href="/assets/truesight-mark.svg" />
    <style>
      :root {
        color-scheme: light;
        font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        color: #0d2118;
        background: #f5faf7;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 80% 10%, rgba(28, 190, 126, 0.14), transparent 30%),
          #f5faf7;
      }
      main {
        width: min(100%, 520px);
        padding: 44px;
        border: 1px solid #dfece4;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 24px 70px rgba(13, 44, 29, 0.08);
        text-align: center;
      }
      img { width: 52px; height: 52px; margin: 0 auto 20px; }
      p {
        margin: 0 0 8px;
        color: #0f9f6e;
        font-family: ui-monospace, monospace;
        font-size: 10px;
        letter-spacing: 0.16em;
      }
      h1 { margin: 0; font-size: 45px; letter-spacing: -0.04em; }
      span { display: block; margin: 12px 0 26px; color: #61756a; font-size: 14px; }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 20px;
        border-radius: 10px;
        color: #fff;
        background: #047857;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover { background: #064e3b; }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/truesight-mark.svg" alt="" />
      <p>404 · PAGE NOT FOUND</p>
      <h1>页面不存在</h1>
      <span>这个地址没有对应的页面，可能已经移动或输入有误。</span>
      <a href="/">返回 TrueSight 首页</a>
    </main>
  </body>
</html>
